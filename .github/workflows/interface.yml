name: iOS Interface Checks
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful iOS Build with fresh native tests and matching product sources (not package-only)
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  interface:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested product sources
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ios-build-policy.py verify-source --run "$SOURCE_RUN"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Run native UI checks
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if x["name"].startswith("iPhone")))')
          xcodebuild -project ClipStudio.xcodeproj -scheme InterfaceChecks -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build \
            -resultBundlePath interface.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            -parallel-testing-enabled NO test | tee interface.log
      - name: Export native screenshots
        if: always()
        run: |
          if [ -d interface.xcresult ]; then
            xcrun xcresulttool export attachments --path interface.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interface-validation
          path: |
            interface.log
            screenshots/*.png
            screenshots/manifest.json
