name: Sensitive Information Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test the sensitive-information guard
        run: python3 -I scripts/test-sensitive-check.py
      - name: Check current source without exposing values
        run: python3 -I scripts/check-sensitive.py
