name: iOS Build
run-name: "iOS ${{ inputs.interface_checks && 'full' || inputs.build_mode || 'unit' }} · ${{ github.ref_name }}"
on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "unit=日常单测+打包；package=仅打包（未测试）；full=单测+全量UI+打包"
        type: choice
        options: [unit, package, full]
        default: unit
      validated_run:
        description: "Optional in unit mode: reuse a successful matching-source native test run"
        required: false
        default: ""
        type: string
      interface_checks:
        description: "Legacy compatibility: true selects full validation (cannot combine with package)"
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select build and validation mode
        id: policy
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'unit' }}
          INTERFACE_CHECKS: ${{ inputs.interface_checks || false }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
        run: python3 scripts/ios-build-policy.py configure
      - name: Verify reusable native validation
        id: reuse
        if: steps.policy.outputs.reuse_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ steps.policy.outputs.reuse_run }}
        run: python3 scripts/ios-build-policy.py verify-source --run "$SOURCE_RUN"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select simulator
        if: steps.policy.outputs.run_tests == 'true'
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for values in d["devices"].values() for x in values if x["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Boot simulator before tests
        if: steps.policy.outputs.run_tests == 'true'
        timeout-minutes: 4
        run: |
          set -o pipefail
          python3 -u - <<'PY' | tee simulator.log
          import os, subprocess
          device = os.environ['SIMULATOR_ID']
          print('Booting simulator before starting Xcode tests:', device, flush=True)
          try:
              subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=180)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
              subprocess.run(['xcrun', 'simctl', 'list', 'devices', 'available'], timeout=20)
              raise
          print('Simulator boot completed.', flush=True)
          PY
      - name: Compile and test native workspace modules
        id: native
        if: steps.policy.outputs.run_tests == 'true'
        timeout-minutes: 25
        env:
          TEST_SCHEME: ${{ steps.policy.outputs.scheme }}
        run: |
          set -o pipefail
          xcodebuild -project ClipStudio.xcodeproj -scheme "$TEST_SCHEME" -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build \
            -resultBundlePath validation.xcresult \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- -parallel-testing-enabled NO test | tee tests.log
      - name: Build unsigned iPhone app
        run: |
          set -o pipefail
          xcodebuild -project ClipStudio.xcodeproj -scheme ClipStudio -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tee build.log
      - name: Package IPA
        id: package
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/ClipStudio.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.example.workbench
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Frameworks/WeiduKit.framework/Info.plist")" = com.example.workbench.reader
          xcrun lipo "$APP/ClipStudio" -verify_arch arm64
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ClipStudio-unsigned.ipa Payload
      - name: Record validation level
        if: always() && steps.policy.outcome == 'success'
        env:
          BUILD_MODE: ${{ inputs.build_mode || 'unit' }}
          INTERFACE_CHECKS: ${{ inputs.interface_checks || false }}
          VALIDATED_RUN: ${{ inputs.validated_run }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          REUSE_OUTCOME: ${{ steps.reuse.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: python3 scripts/ios-build-policy.py summarize
      - uses: actions/upload-artifact@v4
        with:
          name: ClipStudio-unsigned-ipa
          path: ClipStudio-unsigned.ipa
          if-no-files-found: error
      - name: Export UI screenshots
        if: always() && steps.policy.outputs.export_ui == 'true'
        run: |
          if [ -d validation.xcresult ]; then
            xcrun xcresulttool export attachments --path validation.xcresult --output-path screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation
          path: |
            *.log
            validation-summary.json
            screenshots/*.png
            screenshots/*.txt
            screenshots/manifest.json
